name: Apply OneView note

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-oneview-note.yml

permissions:
  contents: write

jobs:
  apply-note:
    runs-on: ubuntu-latest
    steps:
      - name: Add OneView note to No.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          path = Path("works/discord-guide.html")
          text = path.read_text(encoding="utf-8")

          needle = '        <p class="lead">左側の「プラグイン」を選び、プラグイン検索欄の右にある「＋」ボタンを押してください。</p>'
          note = '        <p class="scope"><strong>※画面内の「OneView」は、私個人がChatGPTを使いやすくするために作成したアプリです。この実験は通常のブラウザ版ChatGPTでも行えます。</strong></p>'

          if note not in text:
              if needle not in text:
                  raise SystemExit("Target text was not found. No.5 was not changed.")
              text = text.replace(needle, needle + "\n" + note, 1)
              path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/apply-oneview-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/discord-guide.html .github/workflows/apply-oneview-note.yml
          git commit -m "Add OneView note to No.5"
          git push origin main

name: Apply Aozora download link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-aozora-download-link.yml

permissions:
  contents: write

jobs:
  apply-download-link:
    runs-on: ubuntu-latest
    steps:
      - name: Add Vector download link to No.3
        env:
          GH_TOKEN: ${{ github.token }}
          OLD_B64: "PGRpdiBjbGFzcz0iY3RhLXJvdyI+CjxhIGNsYXNzPSJjdGEgcHJpbWFyeSIgaHJlZj0iI2ZlYXR1cmVzIj7nibnplbfjgpLopovjgos8L2E+CjxhIGNsYXNzPSJjdGEgc2Vjb25kYXJ5IiBocmVmPSIjaG93dG8iPui1t+WLleaJi+mghuOCkuimi+OCizwvYT4KPC9kaXY+"
          NEW_B64: ""
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 -c 'import os,base64,pathlib; p=pathlib.Path("works/aozora-guide.html"); s=p.read_text(encoding="utf-8"); old=base64.b64decode(os.environ["OLD_B64"]).decode("utf-8"); new=base64.b64decode(os.environ["NEW_B64"]).decode("utf-8"); assert old in s, "CTA target not found"; p.write_text(s.replace(old,new,1),encoding="utf-8")'
          rm -f .github/workflows/apply-aozora-download-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/aozora-guide.html .github/workflows/apply-aozora-download-link.yml
          git commit -m "Add Vector download link to No.3"
          git push origin main

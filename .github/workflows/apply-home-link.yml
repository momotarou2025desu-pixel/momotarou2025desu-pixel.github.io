name: Apply Home link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-home-link.yml

permissions:
  contents: write

jobs:
  apply-home:
    runs-on: ubuntu-latest
    steps:
      - name: Add Home link to No.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          path = Path("works/discord-guide.html")
          text = path.read_text(encoding="utf-8")

          needle = '    <nav class="nav" aria-label="ページ内リンク">\n      <a href="#check">確認</a>'
          replacement = '    <nav class="nav" aria-label="ページ内リンク">\n      <a href="../index.html">Home</a>\n      <a href="#check">確認</a>'

          if '<a href="../index.html">Home</a>' not in text:
              if needle not in text:
                  raise SystemExit("Navigation target was not found. No.5 was not changed.")
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/apply-home-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/discord-guide.html .github/workflows/apply-home-link.yml
          git commit -m "Add Home link to No.5"
          git push origin main
          git push origin --delete ai-home-link-20260818 || true

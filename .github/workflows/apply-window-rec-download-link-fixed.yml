name: Apply Window Rec download link fixed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-window-rec-download-link-fixed.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Update No.2 download section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 -c 'from pathlib import Path; p=Path("works/window-rec-guide.html"); t=p.read_text(encoding="utf-8"); old="""      <div class=\"download-box\">\n        <h3>Vector 配布ページからダウンロード</h3>\n        <p>公開後は Vector の配布ページからダウンロードできます。配布ファイルはセットアップ形式で公開する想定です。</p>\n      </div>"""; new="""      <div class=\"download-box\">\n        <h3>Vector 配布ページからダウンロード</h3>\n        <p>Window Rec は Vector の配布ページからダウンロードできます。</p>\n        <p style=\"margin-top:16px\"><a href=\"https://vector.co.jp/soft/winnt/art/se528660.html\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:14px;background:#2563eb;color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 20px rgba(37,99,235,.18)\">Window Recをダウンロード</a></p>\n        <p style=\"margin-top:10px;font-size:13px\">Vectorの配布ページを新しいタブで開きます。</p>\n        <div style=\"margin-top:14px;padding:12px 14px;border:1px solid #f1d28a;border-radius:16px;background:#fff8e7;color:#7a5a12;font-size:13px;line-height:1.65\">※Vectorページでは広告の「ダウンロード」ボタンが表示される場合があります。ソフト名「Window Rec」の配布欄からダウンロードしてください。</div>\n      </div>"""; assert old in t, "target not found"; p.write_text(t.replace(old,new,1),encoding="utf-8")'
          rm -f .github/workflows/apply-window-rec-download-link-fixed.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/window-rec-guide.html .github/workflows/apply-window-rec-download-link-fixed.yml
          git commit -m "Add Vector download link to No.2"
          git push origin main

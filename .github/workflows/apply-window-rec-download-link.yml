name: Apply Window Rec download link

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-window-rec-download-link.yml

permissions:
  contents: write

jobs:
  apply-download-link:
    runs-on: ubuntu-latest
    steps:
      - name: Add Vector download link to No.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          python3 - <<'PY'
          from pathlib import Path

          path = Path("works/window-rec-guide.html")
          text = path.read_text(encoding="utf-8")

          old_css = '''.download-box p {
  margin:0; color:var(--muted); font-size:15px;
}'''

          new_css = '''.download-box p {
  margin:0; color:var(--muted); font-size:15px;
}
.download-action {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:16px;
  padding:12px 20px;
  border-radius:14px;
  background:var(--accent);
  color:#fff;
  font-weight:800;
  font-size:16px;
  box-shadow:0 8px 20px rgba(37,99,235,.18);
}
.download-action:hover {
  background:var(--accent2);
}
.download-help {
  margin-top:10px !important;
  font-size:13px !important;
}
.download-caution {
  margin-top:14px;
  padding:12px 14px;
  border:1px solid #f1d28a;
  border-radius:16px;
  background:#fff8e7;
  color:#7a5a12;
  font-size:13px;
  line-height:1.65;
}'''

          old_html = '''      <div class="download-box">
        <h3>Vector 配布ページからダウンロード</h3>
        <p>公開後は Vector の配布ページからダウンロードできます。配布ファイルはセットアップ形式で公開する想定です。</p>
      </div>'''

          new_html = '''      <div class="download-box">
        <h3>Vector 配布ページからダウンロード</h3>
        <p>Window Rec は Vector の配布ページからダウンロードできます。</p>
        <a class="download-action" href="https://vector.co.jp/soft/winnt/art/se528660.html" target="_blank" rel="noopener noreferrer">Window Recをダウンロード</a>
        <p class="download-help">Vectorの配布ページを新しいタブで開きます。</p>
        <div class="download-caution">※Vectorページでは広告の「ダウンロード」ボタンが表示される場合があります。ソフト名「Window Rec」の配布欄からダウンロードしてください。</div>
      </div>'''

          if new_html not in text:
              if old_html not in text:
                  raise SystemExit("Download section target was not found. No.2 was not changed.")
              text = text.replace(old_html, new_html, 1)

          if new_css not in text:
              if old_css not in text:
                  raise SystemExit("Download CSS target was not found. No.2 was not changed.")
              text = text.replace(old_css, new_css, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm -f .github/workflows/apply-window-rec-download-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/window-rec-guide.html .github/workflows/apply-window-rec-download-link.yml
          git commit -m "Add Vector download link to No.2"
          git push origin main

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPTの達人</title>
  <meta name="description" content="ChatGPTの力を検証・公開するサイト">
  <meta name="google-site-verification" content="C1hBO8sqaQImXIGp560G0f4Y-QuVX2XaNTJ5uXb-Hes" />
  <style>
    :root {
      --bg: #f8f9fa;
      --text: #202124;
      --muted: #5f6368;
      --line: #dadce0;
      --blue: #1a73e8;
      --blue-soft: #e8f0fe;
      --warn-bg: #fff8e1;
      --warn-line: #f0cf72;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      position: relative;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(88px, 18vh, 180px) 16px 56px;
    }

    .wrap {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .hero {
      display: grid;
      gap: 34px;
      justify-items: center;
      text-align: center;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      flex-wrap: nowrap;
    }

    .main-icon {
      width: 132px;
      height: 132px;
      object-fit: contain;
    }

    .headline-wrap {
      text-align: center;
      max-width: none;
    }

    .headline {
      margin: 0;
      font-size: clamp(1.7rem, 3.2vw, 2.6rem);
      font-weight: 700;
      line-height: 1.25;
      white-space: nowrap;
    }

    .single-link,
    .qa-panel {
      width: min(100%, 520px);
    }

    .single-link {
      display: block;
      padding: 18px 28px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      color: var(--blue);
      text-align: center;
      font-size: clamp(1.15rem, 2.4vw, 1.55rem);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .single-link:hover {
      background: var(--blue-soft);
    }

    .qa-panel {
      border: 0;
      margin: 0;
    }

    .qa-panel > summary {
      list-style: none;
      cursor: pointer;
      user-select: none;
    }

    .qa-panel > summary::-webkit-details-marker {
      display: none;
    }

    .qa-panel[open] > summary {
      background: var(--blue-soft);
      border-color: #b8cff0;
    }

    .qa-content {
      margin-top: 12px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      text-align: left;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }

    .qa-q,
    .qa-a,
    .qa-warning {
      margin: 0;
      line-height: 1.75;
    }

    .qa-q {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--text);
    }

    .qa-a {
      margin-top: 12px;
      color: #3c4043;
    }

    .qa-warning {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--warn-line);
      border-radius: 12px;
      background: var(--warn-bg);
      color: #5f4800;
      font-weight: 700;
    }

    .corner-signature {
      position: absolute;
      top: 16px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      z-index: 20;
      white-space: nowrap;
    }

    .corner-signature-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    @media (max-width: 900px) {
      .brand-row {
        flex-direction: column;
        gap: 14px;
      }

      .headline {
        font-size: clamp(1.35rem, 5vw, 2.1rem);
        white-space: normal;
      }
    }

    @media (max-width: 560px) {
      .page {
        padding-top: 64px;
      }

      .corner-signature {
        top: 12px;
        right: 14px;
        gap: 8px;
        font-size: 13px;
      }

      .corner-signature-icon {
        width: 30px;
        height: 30px;
      }

      .main-icon {
        width: 108px;
        height: 108px;
      }

      .single-link {
        padding: 16px 18px;
      }

      .qa-content {
        padding: 17px;
      }
    }
  </style>
</head>
<body>
  <div class="corner-signature" aria-label="by iogusnohin">
    <img class="corner-signature-icon" src="assets/infinity_rainbow_512_whitebg_scale80.png" alt="無限アイコン">
    <span>by iogusnohin</span>
  </div>

  <main class="page">
    <div class="wrap">
      <section class="hero">
        <div class="brand-row">
          <img class="main-icon" src="assets/tatsujin_icon_transparent.png" alt="ChatGPTの達人">
          <div class="headline-wrap">
            <h1 class="headline">ChatGPTの能力を検証・公開中</h1>
          </div>
        </div>

        <a class="single-link" href="works/homepage-guide.html">No.1 完全無料ホームページ作成</a>
        <a class="single-link" href="works/window-rec-guide.html">No.2 完全無料Web動画作成</a>
        <a class="single-link" href="works/aozora-guide.html">No.3 完全無料青空文庫で名作を読もう</a>
        <a class="single-link" href="works/line-stamp-guide.html">No.4 ラインスタンプの作り方</a>

        <details class="qa-panel">
          <summary class="single-link">No.5 ChatGPTからDiscordを操作</summary>
          <div class="qa-content">
            <p class="qa-q">以下の質問をお使いのChatGPTに張り付け確認してください</p>
            <p class="qa-a">「ChatGPTでカスタムMCPアプリを追加できるプランは？」</p>
            <p class="qa-warning">対応プラン以外の方は、このNo.5の実験を試すことはできません。</p>
          </div>
        </details>
      </section>
    </div>
  </main>
</body>
</html>
